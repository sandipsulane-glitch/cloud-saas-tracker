name: Full-Stack SaaS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies and run tests
        run: |
          npm install
          npm test

      - name: Build Docker image
        run: docker build -t cloud-saas-tracker:${{ github.sha }} .

      - name: Verify /health inside running container
        run: |
          docker run -d --name test-container -p 3000:3000 cloud-saas-tracker:${{ github.sha }}
          sleep 3
          curl -sf http://localhost:3000/health > /dev/null
          docker rm -f test-container
